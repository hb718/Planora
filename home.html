<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home | Study Dashboard</title>

    <link rel="stylesheet" href="css/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<aside class="sidebar">

    <nav>

        <a class="nav-item" href="login.html">
            <i data-lucide="user"></i>
            <span>Login</span>
        </a>

        <a class="nav-item" href="home.html">
            <i data-lucide="house"></i>
            <span>Home</span>
        </a>

        <a class="nav-item" href="todo.html">
            <i data-lucide="list-todo"></i>
            <span>Todo</span>
        </a>

        <a class="nav-item" href="assignments.html">
            <i data-lucide="library-big"></i>
            <span>Assignments</span>
        </a>

        <a class="nav-item" href="timer.html">
            <i data-lucide="timer"></i>
            <span>Study</span>
        </a>

        <button id="logout-btn" class="nav-item"> 
            <i data-lucide="log-out"></i> 
            <span>Log Out</span> 
        </button>
    </nav>

</aside>

<div class="page">
    <header class="top-header">

        <div>
            <h1>Welcome<span id="welcome-name"></span>!</h1>
        </div>

        <div class="header-date" id="current-date">
        </div>

    </header>

    <main class="dashboard-grid">

        <section class="card calendar-card">
            <div class="section-heading">
                <div>
                    <p class="section-label">SCHEDULE</p>
                    <h2>Calendar</h2>
                </div>
            </div>

            <div class="calendar-container">
                <div class="calendar-header">
                    <button id="prev" class="calendar-button">
                        &laquo;
                    </button>
                    <h3 id="month-year"></h3>
                    <button id="next" class="calendar-button">
                        &raquo;
                    </button>
                </div>

                <div class="days-of-week">
                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                </div>
                <div id="days-container" class="days-container"></div>
            </div>

        </section>

        <section class="card account-card">
            <div class="section-heading">
                <div>
                    <p class="section-label">ACCOUNT</p>
                    <h2>Profile</h2>
                </div>
                
            </div>

           <div class="profile-content">
    <div class="profile-avatar" id="profile-avatar">
        ?
    </div>
    <div class="profile-details">
        <h3 id="profile-name">
            Loading...
        </h3>
        <p id="profile-email">
            Loading...
        </p>
        <p id="profile-course">
            Student
        </p>
    </div>

</div>
            <div class="account-stats">
                <div>
                    <strong id="todo-count">?</strong>
                    <span>Tasks</span>
                </div>

                <div>
                    <strong id="assignment-count">?</strong>
                    <span>Assignments</span>
                </div>

                <div> 
                    <strong id="hours-studied">?</strong> 
                    <span>Hours Studied</span> 
                </div>
            </div>
        </section>

   
    
<section class="music">
    <div class="music-player">

        <img src="images/mplayer.jpg" alt="Music">

        <button id="music-play-btn" class="music-play-btn">
            ▶
        </button>

        <div id="youtube-player"></div>
    </div>
    <div class="changingmusic">
          <div class="playlist-player">

        <div class="playlist-header">
            <h2 id="playlist-song-title"></h2>
        </div>

        <div id="playlist-youtube-player"></div>

        <div class="playlist-controls">

            <button
                id="playlist-prev"
                type="button"
                aria-label="Previous song"
            >
                ⏮
            </button>

            <button
                id="playlist-play"
                type="button"
                aria-label="Play or pause"
            >
                ▶
            </button>

            <button
                id="playlist-next"
                type="button"
                aria-label="Next song"
            >
                ⏭
            </button>

        </div>

        <div class="playlist-list" id="playlist-list">
        </div>

    </div>
    </div>

</section>





<section class="card mini-card">
    <div class="section-heading">
        <div>
            <p class="section-label">TASKS</p>
            <h2>To-do</h2>
        </div>

        <a href="todo.html" class="view-link">
            View all
        </a>
    </div>

    <div id="mini-todo-list" class="mini-list">
        <p class="mini-empty">Loading...</p>
    </div>
</section>

<section class="card mini-card">
    <div class="section-heading">
        <div>
            <p class="section-label">UPCOMING</p>
            <h2>Assignments</h2>
        </div>

        <a href="assignments.html" class="view-link">
            View all
        </a>
    </div>

    <div id="mini-assignment-list" class="mini-list">
        <p class="mini-empty">Loading...</p>
    </div>
</section>



    </main>

</div>



<div id="event-modal" class="modal">

    <div class="modal-content">

        <button class="close" aria-label="Close">
            &times;
        </button>

        <p class="section-label">CALENDAR</p>

        <h2>Add Event</h2>

        <input
            type="text"
            id="event-name"
            placeholder="Event name"
        >

        <input
            type="date"
            id="event-date"
        >

        <button id="save-event">
            Save Event
        </button>

    </div>

</div>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="js/script.js"></script>
<script src="js/calendar.js"></script>
<script src="js/home.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
    lucide.createIcons();
</script>

</body>
</html>
