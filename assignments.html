<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments</title>
    <link rel="stylesheet" href="css/assignments.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

<aside class="sidebar">
    <nav>
        <a class="nav-item" href="login.html">
            <i data-lucide="user"></i>
            <span>Login</span>
        </a>
        <a class="nav-item" href="home.html">
            <i data-lucide="house"></i>
            <span>Home</span>
        </a>
        <a class="nav-item" href="todo.html">
            <i data-lucide="list-todo"></i>
            <span>Todo</span>
        </a>
        <a class="nav-item" href="assignments.html">
            <i data-lucide="library-big"></i>
            <span>Assignments</span>
        </a>
        <a class="nav-item" href="timer.html">
            <i data-lucide="timer"></i>
            <span>Study</span>
        </a>
        <button id="logout-btn" class="nav-item"> 
            <i data-lucide="log-out"></i> 
            <span>Log Out</span> 
        </button>
    </nav>
</aside>

<main class="assignments-page">
    <!-- HEADER -->
    <header class="assignments-header">
        <div>
            <p class="page-label">SCHOOL WORK</p>
            <h1>Assignments</h1>
        </div>
    </header>

<section class="subjects-section">
    <div class="section-header">
        <div>
            <p class="section-label">SUBJECTS</p>
            <h2>My Subjects</h2>
        </div>
        <button class="add-subject-btn">
            <i data-lucide="plus"></i>
            Add Subject
        </button>
    </div>
    <div class="subject-list">
        <!-- ALL SUBJECTS BUTTON -->
        <button class="subject-pill active" id="allSubjectsBtn">All</button>
    </div>
</section>

<!-- ACTIVE ASSIGNMENTS -->
<section class="assignments-section">
    <div class="section-header">
        <div>
            <p class="section-label">ASSIGNMENTS</p>
            <h2>All Assignments</h2>
        </div>
        <button class="add-assignment-btn">
            <i data-lucide="plus"></i>
            Add Assignment
        </button>
    </div>

    <!-- ACTIVE ASSIGNMENTS TABLE -->
    <div class="assignment-table">
        <!-- TABLE HEADER -->
        <div class="table-row table-header">
            <div class="assignment-column">Assignment</div>
            <div>Priority</div>
            <div>Due Date</div>
            <div>Subject</div>
            <div>Type</div>
            <div>Status</div>
        </div>

    </div>
</section>

<section class="assignments-section completed-section">
    <div class="section-header">
        <div>
            <p class="section-label">COMPLETED</p>
            <h2>Completed Assignments</h2>
        </div>
    </div>

    <div class="assignment-table completed-assignment-table">
-
        <div class="table-row table-header">
            <div class="assignment-column">Assignment</div>
            <div>Priority</div>
            <div>Due Date</div>
            <div>Subject</div>
            <div>Type</div>
            <div>Status</div>
        </div>
        <!-- COMPLETED ASSIGNMENT ROWS ARE ADDED HERE BY assignments.js -->
    </div>
</section>


</main>

<script src="js/script.js"></script>
<script src="js/assignments.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
    lucide.createIcons();
</script>
