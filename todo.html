<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Todo</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
>

</head>
<body>

<aside class="sidebar">

    <nav>

        <a
            class="nav-item"
            href="login.html"
        >
            <i data-lucide="user"></i>
            <span>Login</span>
        </a>


        <a
            class="nav-item"
            href="home.html"
        >
            <i data-lucide="house"></i>
            <span>Home</span>
        </a>


        <a
            class="nav-item"
            href="todo.html"
        >
            <i data-lucide="list-todo"></i>
            <span>Todo</span>
        </a>


        <a
            class="nav-item"
            href="assignments.html"
        >
            <i data-lucide="library-big"></i>
            <span>Assignments</span>
        </a>


        <a
            class="nav-item"
            href="timer.html"
        >
            <i data-lucide="timer"></i>
            <span>Study</span>
        </a>
        <button id="logout-btn" class="nav-item"> 
            <i data-lucide="log-out"></i> 
            <span>Log Out</span> 
        </button>

    </nav>

</aside>

<main class="todo-page">


    <div class="todo-header">

        <div>

            <p class="todo-label">
             TASKS
            </p>

            <h1>
            To-do List
            </h1>

        </div>


        <button
            class="add-task-btn"
            id="addTaskBtn"
        >

            <i data-lucide="plus"></i>

            Add task

        </button>

    </div>


    <div
        id="taskForm"
        style="display: none;"
    >

        <input
            type="text"
            id="taskName"
            placeholder="Task name"
        >


        <select id="taskCategory">

            <option value="School">
                School
            </option>

            <option value="Study">
                Study
            </option>

            <option value="Personal">
                Personal
            </option>

        </select>


        <button
            type="button"
            id="saveTaskBtn"
        >
            Save Task
        </button>


        <button
            type="button"
            id="cancelTaskBtn"
        >
            Cancel
        </button>

    </div>

    <div class="todo-filters">

        <button
            class="filter-btn active"
            data-filter="all"
        >
            All
        </button>


        <button
            class="filter-btn"
            data-filter="today"
        >
            Today
        </button>


        <button
            class="filter-btn"
            data-filter="week"
        >
            This Week
        </button>


        <button
            class="filter-btn"
            data-filter="completed"
        >
            Completed
        </button>

    </div>

    <section
        class="task-list"
        id="taskList"
    >


    </section>


</main>


<script
    src="https://unpkg.com/lucide@latest"
></script>



<script src="js/script.js"></script>

<script>

    lucide.createIcons();

</script>
</body>

</html>
